# Authorized target: one Starter web service (US$7/month base compute).
# Upgrade the existing service; do not create duplicate resources.
services:
  - type: web
    name: lunar-oracle
    runtime: docker
    repo: https://github.com/GabrielChambi/NASA_MISION_ARTEMISA
    branch: main
    plan: 0.5c-512mb
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: 'off'
    healthCheckPath: /api/ready
    maxShutdownDelaySeconds: 60
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.5-flash-lite
      - key: LUNAR_REQUIRE_GEMINI
        value: '1'
      - key: GEMINI_API_KEY
        sync: false
